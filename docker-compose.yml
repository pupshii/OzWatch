services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ozwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ozwatch}
      POSTGRES_DB: ozwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozwatch -d ozwatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host by default. Uncomment to poke at it with psql / DBeaver:
    # ports: ["5432:5432"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Values come from .env (Compose reads it automatically); blank if unset.
    environment:
      DATABASE_URL: postgresql://ozwatch:${POSTGRES_PASSWORD:-ozwatch}@db:5432/ozwatch
      TFNSW_API_KEY: ${TFNSW_API_KEY:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      POLL_CAMERAS: ${POLL_CAMERAS:-}
      POLL_FLIGHTS: ${POLL_FLIGHTS:-}
      HISTORY_HOURS: ${HISTORY_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
