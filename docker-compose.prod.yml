# Production overlay: adds Caddy in front of the API with automatic HTTPS.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Needs DOMAIN (and a strong POSTGRES_PASSWORD) in .env, and the domain's DNS
# A record pointing at this server. See docs/deploy.md.
services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
